<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Навык 1: Будьте Проактивны</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class', // Включаем режим по классу
            theme: {
                extend: {
                    colors: {
                        gray: {
                            750: '#2d3748',
                            850: '#1a202c',
                            950: '#0d1117',
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; }
        .animate-in { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Скроллбар */
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 20px; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #4b5563; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-gray-950 dark:text-gray-100 transition-colors duration-300">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        import { getFirestore, doc, setDoc, onSnapshot } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        const appId = typeof window.__app_id !== 'undefined' ? window.__app_id : 'default-app-id';
        const firebaseConfigString = typeof window.__firebase_config !== 'undefined' ? window.__firebase_config : null;
        const firebaseConfig = firebaseConfigString ? JSON.parse(firebaseConfigString) : null;
        const initialAuthToken = typeof window.__initial_auth_token !== 'undefined' ? window.__initial_auth_token : null;

        // --- Иконки ---
        const IconBase = ({ children, size = 24, className = "", ...props }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
                {children}
            </svg>
        );

        const Icons = {
            BookOpen: (props) => <IconBase {...props}><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></IconBase>,
            Target: (props) => <IconBase {...props}><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></IconBase>,
            CheckCircle: (props) => <IconBase {...props}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></IconBase>,
            Circle: (props) => <IconBase {...props}><circle cx="12" cy="12" r="10"/></IconBase>,
            Award: (props) => <IconBase {...props}><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"/></IconBase>,
            TrendingUp: (props) => <IconBase {...props}><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></IconBase>,
            Users: (props) => <IconBase {...props}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></IconBase>,
            Brain: (props) => <IconBase {...props}><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 1.98-3A2.5 2.5 0 0 1 9.5 2Z"/><path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-1.98-3A2.5 2.5 0 0 0 14.5 2Z"/></IconBase>,
            Heart: (props) => <IconBase {...props}><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></IconBase>,
            Zap: (props) => <IconBase {...props}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></IconBase>,
            ChevronRight: (props) => <IconBase {...props}><path d="m9 18 6-6-6-6"/></IconBase>,
            Menu: (props) => <IconBase {...props}><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></IconBase>,
            X: (props) => <IconBase {...props}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></IconBase>,
            Lightbulb: (props) => <IconBase {...props}><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></IconBase>,
            AlertCircle: (props) => <IconBase {...props}><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></IconBase>,
            Star: (props) => <IconBase {...props}><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></IconBase>,
            Smile: (props) => <IconBase {...props}><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" x2="9.01" y1="9" y2="9"/><line x1="15" x2="15.01" y1="9" y2="9"/></IconBase>,
            Key: (props) => <IconBase {...props}><circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6"/><path d="m15.5 7.5 3 3L22 7l-3-3"/></IconBase>,
            RefreshCw: (props) => <IconBase {...props}><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></IconBase>,
            Scale: (props) => <IconBase {...props}><path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="M7 21h10"/><path d="M12 3v18"/><path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"/></IconBase>,
            AlertTriangle: (props) => <IconBase {...props}><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" x2="12" y1="9" y2="13"/><line x1="12" x2="12.01" y1="17" y2="17"/></IconBase>,
            Gift: (props) => <IconBase {...props}><polyline points="20 12 20 22 4 22 4 12" /><rect width="20" height="5" x="2" y="7" /><line x1="12" x2="12" y1="22" y2="7" /><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z" /><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z" /></IconBase>,
            Moon: (props) => <IconBase {...props}><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></IconBase>,
            Sun: (props) => <IconBase {...props}><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></IconBase>,
        };

        const { useState, useEffect } = React;

        const ProactiveHabitApp = () => {
            const [activeSection, setActiveSection] = useState('intro');
            const [challengeProgress, setChallengeProgress] = useState({});
            const [showMenu, setShowMenu] = useState(false);
            const [db, setDb] = useState(null);
            const [userId, setUserId] = useState(null);
            const [loadingStatus, setLoadingStatus] = useState('Загрузка...');
            
            // Темная тема
            const [isDarkMode, setIsDarkMode] = useState(false);

            useEffect(() => {
                // Проверка системных настроек
                if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    setIsDarkMode(true);
                }
            }, []);

            useEffect(() => {
                if (isDarkMode) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }, [isDarkMode]);

            useEffect(() => {
                if (!firebaseConfig) {
                    setLoadingStatus('Демо');
                    return;
                }
                try {
                    const app = initializeApp(firebaseConfig);
                    const auth = getAuth(app);
                    const firestoreDb = getFirestore(app);
                    setDb(firestoreDb);

                    const initAuth = async () => {
                        try {
                            if (initialAuthToken) await signInWithCustomToken(auth, initialAuthToken);
                            else await signInAnonymously(auth);
                        } catch (e) { console.error(e); }
                    };
                    initAuth();

                    onAuthStateChanged(auth, (user) => {
                        setUserId(user ? user.uid : null);
                        setLoadingStatus(user ? '' : 'Вход...');
                    });
                } catch (error) {
                    setLoadingStatus('Ошибка');
                }
            }, []);

            useEffect(() => {
                if (db && userId) {
                    const docRef = doc(db, 'artifacts', appId, 'users', userId, 'proactive_data', 'progress_tracker');
                    return onSnapshot(docRef, (docSnap) => {
                        if (docSnap.exists()) setChallengeProgress(docSnap.data().progress || {});
                    });
                }
            }, [db, userId]);

            const toggleDay = async (day) => {
                const newProgress = { ...challengeProgress, [day]: !challengeProgress[day] };
                setChallengeProgress(newProgress);
                if (db && userId) {
                    try {
                        await setDoc(doc(db, 'artifacts', appId, 'users', userId, 'proactive_data', 'progress_tracker'), { progress: newProgress }, { merge: true });
                    } catch (e) {}
                }
            };

            const completedDays = Object.values(challengeProgress).filter(Boolean).length;

            // Обновленная структура: Дары вынесены в отдельный пункт
            const sections = [
                { id: 'intro', title: '1. Введение: Самосознание', icon: Icons.Brain },
                { id: 'gifts', title: '2. 4 Уникальных дара', icon: Icons.Gift },
                { id: 'mirror', title: '3. Социальное зеркало', icon: Icons.Users },
                { id: 'determinism', title: '4. Три вида детерминизма', icon: Icons.AlertCircle },
                { id: 'frankl', title: '5. Урок Виктора Франкла', icon: Icons.Heart },
                { id: 'proactivity', title: '6. Суть проактивности', icon: Icons.Zap },
                { id: 'initiative', title: '7. Брать инициативу', icon: Icons.Target },
                { id: 'language', title: '8. Реактивная речь', icon: Icons.BookOpen },
                { id: 'circles', title: '9. Круги Влияния', icon: Icons.TrendingUp },
                { id: 'control', title: '10. Типы контроля', icon: Icons.Star },
                { id: 'expanding', title: '11. Расширение влияния', icon: Icons.Lightbulb },
                { id: 'havebe', title: '12. Иметь или Быть', icon: Icons.Smile },
                { id: 'love', title: '13. Любовь — это глагол', icon: Icons.Heart },
                { id: 'consequences', title: '14. Выбор и Последствия', icon: Icons.Scale },
                { id: 'commitments', title: '15. Обязательства', icon: Icons.CheckCircle },
                { id: 'challenge', title: '16. 30-дневный тест', icon: Icons.Award }
            ];

            const InfoCard = ({ icon: IconComp, title, text, color }) => (
                <div className={`bg-white dark:bg-gray-800 p-4 md:p-5 rounded-xl border-l-4 border-${color}-500 shadow-md hover:shadow-lg transition-all mb-4 md:mb-0`}>
                    <div className="flex items-center gap-3 mb-2">
                        <div className={`p-2 rounded-full bg-${color}-100 dark:bg-${color}-900/30 text-${color}-600 dark:text-${color}-400 flex-shrink-0`}>
                            <IconComp size={20} />
                        </div>
                        <h4 className={`font-bold text-${color}-900 dark:text-${color}-200 text-sm md:text-base`}>{title}</h4>
                    </div>
                    <p className="text-sm text-gray-700 dark:text-gray-300 leading-relaxed">{text}</p>
                </div>
            );

            const QuoteBlock = ({ text, author }) => (
                <div className="bg-gradient-to-r from-gray-50 to-gray-100 dark:from-gray-800 dark:to-gray-900 border-l-4 border-purple-500 p-4 md:p-6 rounded-r-xl my-4 italic text-gray-700 dark:text-gray-300 shadow-sm text-sm md:text-base">
                    "{text}"
                    {author && <div className="mt-2 text-xs font-bold text-purple-600 dark:text-purple-400 not-italic">— {author}</div>}
                </div>
            );

            // Визуализации адаптированы под темную тему
             const CirclesVisualization = () => (
                <div className="my-6 p-4 bg-gradient-to-br from-blue-50 to-indigo-50 dark:from-blue-900/20 dark:to-indigo-900/20 rounded-xl shadow-inner">
                    <h3 className="text-lg md:text-xl font-bold text-center mb-6 text-gray-800 dark:text-gray-200">Фокус внимания</h3>
                    <div className="flex flex-col md:flex-row justify-around items-center gap-8">
                        <div className="relative">
                            <div className="w-48 h-48 md:w-64 md:h-64 rounded-full bg-red-100 dark:bg-red-900/30 border-4 border-red-300 dark:border-red-700 flex items-center justify-center shadow-lg transition-all">
                                <div className="w-32 h-32 md:w-40 md:h-40 rounded-full bg-red-200 dark:bg-red-900/50 border-4 border-red-400 dark:border-red-600 flex items-center justify-center">
                                    <div className="text-center p-2">
                                        <p className="font-bold text-red-900 dark:text-red-200 text-sm md:text-base">Круг Забот</p>
                                        <p className="text-[10px] md:text-xs mt-1 text-red-800 dark:text-red-300 leading-tight">Внешние условия<br/>(Вне контроля)</p>
                                    </div>
                                </div>
                            </div>
                            <div className="absolute -bottom-3 left-0 right-0 text-center">
                                <span className="bg-red-500 text-white px-3 py-1 rounded-full text-xs md:text-sm shadow-md font-bold">Влияние сужается</span>
                            </div>
                        </div>
                        <div className="md:hidden text-gray-300 dark:text-gray-600 rotate-90"><Icons.ChevronRight size={24}/></div>
                        <div className="relative">
                            <div className="w-48 h-48 md:w-64 md:h-64 rounded-full bg-green-100 dark:bg-green-900/30 border-4 border-green-300 dark:border-green-700 flex items-center justify-center shadow-lg transition-all">
                                <div className="w-36 h-36 md:w-48 md:h-48 rounded-full bg-green-200 dark:bg-green-900/50 border-4 border-green-400 dark:border-green-600 flex items-center justify-center">
                                    <div className="text-center p-2">
                                        <p className="font-bold text-green-900 dark:text-green-200 text-sm md:text-base">Круг Влияния</p>
                                        <p className="text-[10px] md:text-xs mt-1 text-green-800 dark:text-green-300 leading-tight">Мой характер<br/>Мои решения</p>
                                    </div>
                                </div>
                            </div>
                            <div className="absolute -bottom-3 left-0 right-0 text-center">
                                <span className="bg-green-500 text-white px-3 py-1 rounded-full text-xs md:text-sm shadow-md font-bold">Влияние растет</span>
                            </div>
                        </div>
                    </div>
                     [Image of Circle of Concern and Circle of Influence]
                </div>
            );

             const StimulusResponse = () => (
                <div className="my-6 p-4 md:p-6 bg-gradient-to-br from-purple-50 to-pink-50 dark:from-purple-900/30 dark:to-pink-900/30 rounded-xl shadow-lg">
                    <h3 className="text-lg md:text-xl font-bold text-center mb-6 text-gray-800 dark:text-gray-200">Модель Свободы Выбора</h3>
                    <div className="flex flex-col md:flex-row items-center justify-center gap-4">
                        <div className="bg-orange-500 text-white px-6 py-3 rounded-lg font-bold text-center shadow-md w-full md:w-auto text-sm md:text-base">
                            Раздражитель
                        </div>
                        <Icons.ChevronRight className="text-gray-400 dark:text-gray-600 hidden md:block" size={32} />
                        <div className="text-gray-400 dark:text-gray-600 md:hidden text-xl rotate-90"><Icons.ChevronRight/></div>
                        
                        <div className="bg-gradient-to-r from-purple-600 to-pink-600 text-white p-4 md:p-6 rounded-xl text-center flex-1 shadow-xl w-full md:w-auto">
                            <p className="font-extrabold mb-3 text-sm md:text-lg tracking-wider">СВОБОДА ВЫБОРА</p>
                            <div className="grid grid-cols-2 gap-2 md:gap-3 text-[10px] md:text-sm font-medium text-purple-100">
                                <div className="bg-white/20 p-1 rounded">Самосознание</div>
                                <div className="bg-white/20 p-1 rounded">Воображение</div>
                                <div className="bg-white/20 p-1 rounded">Совесть</div>
                                <div className="bg-white/20 p-1 rounded">Независимая Воля</div>
                            </div>
                        </div>
                        
                        <Icons.ChevronRight className="text-gray-400 dark:text-gray-600 hidden md:block" size={32} />
                        <div className="text-gray-400 dark:text-gray-600 md:hidden text-xl rotate-90"><Icons.ChevronRight/></div>

                        <div className="bg-green-500 text-white px-6 py-3 rounded-lg font-bold text-center shadow-md w-full md:w-auto text-sm md:text-base">
                            Реакция
                        </div>
                    </div>
                    <p className="text-center mt-4 md:mt-6 text-gray-600 dark:text-gray-400 italic text-xs md:text-sm">
                        "Между раздражителем и реакцией человек имеет свободу выбора"
                    </p>
                </div>
            );


            const renderContent = () => {
                const fadeClass = "animate-in space-y-6 pb-20 md:pb-0";
                
                switch (activeSection) {
                    case 'intro': return (
                        <div className={fadeClass}>
                            <h2 className="text-2xl md:text-3xl font-bold text-gray-800 dark:text-gray-100">1. Введение: Самосознание</h2>
                            <QuoteBlock text="Не знаю в жизни ничего более воодушевляющего, чем бесспорная способность человека путем сознательных усилий возвышать жизнь свою." author="Генри Дэвид Торо" />
                            
                            <div className="bg-blue-50 dark:bg-blue-900/20 p-4 md:p-6 rounded-xl border-t-4 border-blue-400 shadow-sm">
                                <h3 className="font-bold text-blue-900 dark:text-blue-300 mb-2 flex items-center gap-2 text-lg"><Icons.Brain size={24}/> Определение</h3>
                                <p className="text-gray-700 dark:text-gray-300 leading-relaxed">
                                    <b>Самосознание</b> — это способность отстраниться и посмотреть на свои мысли, чувства и действия со стороны. Животные на это не способны; они живут инстинктами. Именно самосознание позволяет нам не быть рабами своих программ, а переписывать их.
                                </p>
                            </div>
                            
                            <div className="bg-white dark:bg-gray-800 p-5 rounded-xl shadow-md border border-gray-100 dark:border-gray-700">
                                <h4 className="font-bold text-gray-800 dark:text-gray-200 mb-2 text-lg">💡 Пример из жизни</h4>
                                <p className="text-gray-700 dark:text-gray-300 italic">
                                    "Попробуйте прямо сейчас мысленно перенестись в угол комнаты и посмотреть на себя, читающего этот текст. Вы можете оценить свою позу? Свое настроение? То, что вы сейчас сделали — это акт самосознания."
                                </p>
                            </div>
                        </div>
                    );
                    // Новый раздел!
                    case 'gifts': return (
                        <div className={fadeClass}>
                            <h2 className="text-2xl md:text-3xl font-bold text-gray-800 dark:text-gray-100">2. 4 Уникальных дара человека</h2>
                            <p className="text-gray-700 dark:text-gray-300 text-sm md:text-base">
                                Это инструменты, которые дают нам власть над нашей реакцией. Они отличают нас от животного мира.
                            </p>
                             <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <InfoCard color="purple" icon={Icons.Brain} title="Самосознание" text="Понимание своих мыслей, настроений и парадигм. Способность отделить себя от своих эмоций." />
                                <InfoCard color="green" icon={Icons.Heart} title="Совесть" text="Внутреннее чувство правильного и неправильного. Компас, который указывает на истинный север." />
                                <InfoCard color="blue" icon={Icons.Zap} title="Воображение" text="Способность создавать в уме то, чего нет в реальности. Визуализация будущего успеха." />
                                <InfoCard color="orange" icon={Icons.TrendingUp} title="Независимая воля" text="Способность действовать, опираясь на самосознание, а не на инстинкты или давление окружения." />
                            </div>
                        </div>
                    );

                                <p className="text-gray-700 dark:text-gray-300 text-sm mb-3">
                                    В реактивном языке любовь — это чувство, которым управляют гормоны или обстоятельства. В проактивном языке <b>любовь — это глагол</b>. Любовь-чувство есть плод любви-действия.
                                </p>
                                <p className="font-bold text-green-700 dark:text-green-400 text-sm">Пример любви-глагола: служить, жертвовать собой, слушать, сопереживать, ценить.</p>
                            </div>
                        </div>
                    );
                    case 'consequences': return (
                        <div className={fadeClass}>
                            <h2 className="text-2xl md:text-3xl font-bold text-gray-800 dark:text-gray-100">14. Выбор и Последствия</h2>
                             <div className="bg-orange-50 dark:bg-orange-900/20 p-4 md:p-6 rounded-xl border-t-4 border-orange-400 shadow-sm">
                                <h3 className="font-bold text-orange-900 dark:text-orange-300 mb-2 flex items-center gap-2 text-lg"><Icons.Scale size={24}/> Закон Палки</h3>
                                <p className="text-gray-700 dark:text-gray-300">
                                    Мы свободны в выборе наших действий, но мы <b>не свободны</b> в выборе последствий этих действий. Последствия управляются естественными законами.
                                </p>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
                                <div className="bg-white dark:bg-gray-800 p-5 rounded-xl shadow-md">
                                    <h4 className="font-bold text-gray-800 dark:text-gray-200 mb-2">Пример с поездом</h4>
                                    <p className="text-sm text-gray-600 dark:text-gray-400">
                                        Мы можем решить встать на пути мчащегося поезда (свободный выбор действия), но мы не можем решить, что будет, когда он на нас наедет (неизбежное последствие). Поднимая один конец палки, мы поднимаем и другой.
                                    </p>
                                </div>
                                <div className="bg-white dark:bg-gray-800 p-5 rounded-xl shadow-md">
                                    <h4 className="font-bold text-gray-800 dark:text-gray-200 mb-2">Отношение к ошибкам</h4>
                                    <p className="text-sm text-gray-600 dark:text-gray-400">
                                        Если выбор принес плохие последствия (ошибка), проактивный подход: <b>мгновенно признать, исправить и извлечь урок</b>. Утаивание ошибки — это уже вторая ошибка.
                                    </p>
                                </div>
                            </div>
                        </div>
                    );
                    case 'commitments': return (
                        <div className={fadeClass}>
                            <h2 className="text-2xl md:text-3xl font-bold text-gray-800 dark:text-gray-100">15. Обязательства</h2>
                             <div className="bg-indigo-50 dark:bg-indigo-900/20 p-4 md:p-6 rounded-xl border-t-4 border-indigo-500 shadow-sm">
                                <h3 className="font-bold text-indigo-900 dark:text-indigo-300 mb-2 flex items-center gap-2 text-lg"><Icons.Key size={24}/> Суть роста</h3>
                                <p className="text-gray-700 dark:text-gray-300">
                                    В самом центре нашего Круга Влияния находится способность <b>давать обещания и держать их</b>. Это и есть проактивность.
                                </p>
                            </div>
                            
                            <div className="mt-4 bg-white dark:bg-gray-800 p-5 rounded-xl shadow-md border border-gray-100 dark:border-gray-700">
                                <h4 className="font-bold text-gray-800 dark:text-gray-200 mb-2">Пример: Малые победы</h4>
                                <p className="text-sm text-gray-700 dark:text-gray-300 mb-2">
                                    Не нужно сразу обещать "никогда больше не есть сладкого". Начните с малого. Пообещайте себе не есть десерт <i>сегодня</i> в обед. Или встать ровно по первому звонку будильника.
                                </p>
                                <p className="text-sm text-indigo-700 dark:text-indigo-400 font-medium">
                                    Выполняя эти малые обещания, вы развиваете свою внутреннюю целостность. Ваше чувство чести становится сильнее ваших сиюминутных настроений.
                                </p>
                            </div>
                        </div>
                    );
                    case 'challenge': return (
                        <div className={fadeClass}>
                            <h2 className="text-2xl md:text-3xl font-bold text-gray-900 dark:text-white mb-4">16. 30-дневный тест</h2>
                            <div className="bg-gradient-to-r from-purple-600 to-indigo-600 text-white p-6 md:p-8 rounded-2xl shadow-2xl mb-6 relative overflow-hidden">
                                <Icons.Award className="absolute -right-6 -bottom-6 opacity-30 transform rotate-12" size={150}/>
                                <h3 className="text-lg md:text-xl font-bold mb-2 relative z-10 text-purple-200 uppercase tracking-widest">Ваш прогресс</h3>
                                <div className="flex items-end gap-2 md:gap-3 mb-4 md:mb-6 relative z-10">
                                    <span className="text-4xl md:text-6xl font-extrabold">{completedDays}</span>
                                    <span className="text-sm md:text-lg opacity-80 mb-1 md:mb-2 font-medium">/ 30 дней</span>
                                </div>
                                <div className="h-2 md:h-3 bg-black/20 rounded-full overflow-hidden relative z-10 backdrop-blur-sm">
                                    <div className="h-full bg-white transition-all duration-1000 ease-out shadow-[0_0_10px_rgba(255,255,255,0.5)]" style={{ width: `${(completedDays / 30) * 100}%` }}></div>
                                </div>
                            </div>

                            <div className="space-y-2 md:space-y-3">
                                {[
                                    "1. Следите за речью: ловите «я не могу»", "2. Замените «я должен» на «я выбираю»", "3. Определите Круг Влияния в проблеме", "4. Сделайте дело без напоминания", "5. Признайте ошибку мгновенно", "6. Не критикуйте никого весь день", "7. Анализ недели: что изменилось?", "8. Дайте обещание себе и выполните", "9. Проявите эмпатию вместо злости", "10. Три часа только в Круге Влияния",
                                    "11. Превратите жалобу в план", "12. Сохраните спокойствие в стрессе", "13. Помогите тому, кто вам не нравится", "14. Отметьте 5 проактивных решений", "15. Фокус на «БЫТЬ» (характер)", "16. Несите свою «погоду» в душе", "17. Поступите по совести, а не по выгоде", "18. Анонимное доброе дело", "19. Изучите что-то новое (Круг Влияния)", "20. Станьте частью решения дома",
                                    "21. 3 недели! Наградите себя", "22. Возьмите ответственность за сбой", "23. Влияйте примером, а не спором", "24. Улыбнитесь проблеме, которую не решить", "25. Извлеките урок из неудачи", "26. Исправьте чужую ошибку молча", "27. Сделайте чью-то ношу легче", "28. Записывайте проактивные мысли", "29. Расскажите другу о проактивности", "30. Финиш! Вы — творец своей жизни!"
                                ].map((task, i) => (
                                    <div key={i} onClick={() => toggleDay(i + 1)} className={`p-3 md:p-4 rounded-xl border-2 dark:border-gray-700 flex items-center gap-3 md:gap-4 transition-all cursor-pointer hover:shadow-md active:scale-[0.98] ${challengeProgress[i + 1] ? 'bg-green-50 dark:bg-green-900/20 border-green-200 dark:border-green-800' : 'bg-white dark:bg-gray-800 hover:border-purple-200 dark:hover:border-purple-900'}`}>
                                        {challengeProgress[i + 1] ? <div className="bg-green-500 text-white p-1 rounded-full flex-shrink-0"><Icons.CheckCircle size={16}/></div> : <Icons.Circle className="w-6 h-6 text-gray-200 dark:text-gray-600 flex-shrink-0"/>}
                                        <span className={`text-xs md:text-base ${challengeProgress[i+1] ? 'text-gray-400 dark:text-gray-500 line-through decoration-2' : 'text-gray-700 dark:text-gray-300 font-medium'}`}>{task}</span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    );
                    default: return null;
                }
            };

            return (
                <div className="min-h-screen font-sans">
                    <header className="bg-white dark:bg-gray-900 sticky top-0 z-30 shadow-md border-b border-gray-100 dark:border-gray-800 px-4 py-3 flex items-center justify-between md:hidden">
                        <div className="flex items-center gap-2">
                            <div className="bg-gradient-to-br from-purple-600 to-indigo-600 text-white p-2 rounded-lg shadow-sm"><Icons.BookOpen size={20}/></div>
                            <span className="font-bold text-gray-800 dark:text-white text-lg">Навык 1</span>
                        </div>
                         <div className="flex items-center gap-2">
                            <button onClick={() => setIsDarkMode(!isDarkMode)} className="p-2 bg-gray-100 dark:bg-gray-800 rounded-full text-gray-700 dark:text-gray-300">
                                {isDarkMode ? <Icons.Sun size={20}/> : <Icons.Moon size={20}/>}
                            </button>
                            <button onClick={() => setShowMenu(true)} className="p-2 bg-gray-100 dark:bg-gray-800 rounded-full active:bg-gray-200 text-gray-700 dark:text-gray-300"><Icons.Menu size={24}/></button>
                        </div>
                    </header>

                    {showMenu && (
                        <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm animate-in fade-in" onClick={() => setShowMenu(false)}>
                            <div className="absolute right-0 top-0 bottom-0 w-[85%] max-w-xs bg-white dark:bg-gray-900 shadow-2xl p-6 overflow-y-auto" onClick={e => e.stopPropagation()}>
                                <div className="flex justify-between items-center mb-8">
                                    <h2 className="font-bold text-2xl text-gray-900 dark:text-white">Меню</h2>
                                    <button onClick={() => setShowMenu(false)} className="p-2 bg-gray-100 dark:bg-gray-800 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 text-gray-800 dark:text-gray-200"><Icons.X size={24}/></button>
                                </div>
                                <div className="space-y-2">
                                    {sections.map(s => (
                                        <button key={s.id} onClick={() => {setActiveSection(s.id); setShowMenu(false); window.scrollTo(0,0);}} className={`w-full text-left p-4 rounded-xl flex items-center gap-4 transition-all ${activeSection === s.id ? 'bg-purple-100 dark:bg-purple-900/40 text-purple-700 dark:text-purple-300 font-bold shadow-sm' : 'text-gray-600 dark:text-gray-400 hover:bg-gray-50 dark:hover:bg-gray-800'}`}>
                                            <s.icon size={20}/> <span className="text-base">{s.title}</span>
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    <div className="max-w-7xl mx-auto md:p-8 flex items-start gap-8">
                        <aside className="hidden md:block w-80 shrink-0 sticky top-8">
                            <div className="bg-white dark:bg-gray-900 rounded-2xl shadow-lg border border-gray-100 dark:border-gray-800 p-6">
                                <div className="flex items-center justify-between mb-8 px-2">
                                    <div className="flex items-center gap-4">
                                        <div className="bg-gradient-to-br from-purple-600 to-indigo-600 p-3 rounded-xl text-white shadow-lg"><Icons.BookOpen size={28}/></div>
                                        <div><h1 className="font-bold text-gray-900 dark:text-white text-xl leading-tight">Будьте<br/>проактивны</h1><p className="text-xs text-purple-500 dark:text-purple-400 font-bold uppercase tracking-wider mt-1">Навык 1</p></div>
                                    </div>
                                     <button onClick={() => setIsDarkMode(!isDarkMode)} className="p-2 bg-gray-100 dark:bg-gray-800 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors text-gray-600 dark:text-gray-400">
                                        {isDarkMode ? <Icons.Sun size={20}/> : <Icons.Moon size={20}/>}
                                    </button>
                                </div>
                                <nav className="space-y-1 max-h-[60vh] overflow-y-auto custom-scrollbar pr-2">
                                    {sections.map(s => (
                                        <button key={s.id} onClick={() => {setActiveSection(s.id); window.scrollTo(0,0);}} className={`w-full text-left px-4 py-3 rounded-xl flex items-center gap-3 transition-all text-sm font-medium ${activeSection === s.id ? 'bg-gradient-to-r from-purple-600 to-indigo-600 text-white shadow-md transform scale-105' : 'text-gray-600 dark:text-gray-400 hover:bg-gray-50 dark:hover:bg-gray-800 hover:pl-5'}`}>
                                            <s.icon size={18}/> <span>{s.title}</span>
                                        </button>
                                    ))}
                                </nav>
                                <div className="mt-6 pt-6 border-t border-gray-100 dark:border-gray-800 px-2">
                                    <p className="text-xs text-gray-400 uppercase font-bold mb-3 tracking-widest">Ваш прогресс</p>
                                    <div className="flex items-center gap-3 text-sm font-bold text-gray-700 dark:text-gray-300">
                                        <div className="flex-1 h-2 bg-gray-100 dark:bg-gray-800 rounded-full overflow-hidden"><div className="h-full bg-green-500 transition-all duration-500" style={{ width: `${(completedDays / 30) * 100}%` }}></div></div>
                                        <span>{Math.round((completedDays / 30) * 100)}%</span>
                                    </div>
                                </div>
                            </div>
                        </aside>

                        <main className="flex-1 w-full min-w-0 bg-white dark:bg-gray-900 md:rounded-3xl md:shadow-xl md:border md:border-gray-100 dark:border-gray-800 min-h-screen md:min-h-[800px] overflow-hidden transition-colors duration-300">
                             <div className="hidden md:flex border-b border-gray-100 dark:border-gray-800 p-8 justify-between items-center bg-gray-50/30 dark:bg-gray-800/30">
                                <div className="flex items-center gap-3">
                                    <div className="p-2 bg-white dark:bg-gray-800 rounded-lg shadow-sm border border-gray-100 dark:border-gray-700">{React.createElement(sections.find(s => s.id === activeSection)?.icon || Icons.BookOpen, { size: 20, className: "text-purple-600 dark:text-purple-400" })}</div>
                                    <h2 className="font-bold text-gray-400 text-xs uppercase tracking-widest">{sections.find(s => s.id === activeSection)?.title}</h2>
                                </div>
                             </div>
                            <div className="p-4 sm:p-6 md:p-10 lg:p-12">
                                {renderContent()}
                            </div>
                        </main>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ProactiveHabitApp />);
    </script>
</body>
</html>
