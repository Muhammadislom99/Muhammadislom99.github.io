<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Навык 1: Будьте Проактивны</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* Дополнительные стили для плавности */
        body { font-family: 'Inter', sans-serif; background-color: #f9fafb; }
        .animate-in { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        // --- Импорт Firebase через CDN ---
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        import { getFirestore, doc, setDoc, onSnapshot } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        // --- Получение переменных окружения (безопасно) ---
        const appId = typeof window.__app_id !== 'undefined' ? window.__app_id : 'default-app-id';
        const firebaseConfigString = typeof window.__firebase_config !== 'undefined' ? window.__firebase_config : null;
        const firebaseConfig = firebaseConfigString ? JSON.parse(firebaseConfigString) : null;
        const initialAuthToken = typeof window.__initial_auth_token !== 'undefined' ? window.__initial_auth_token : null;

        // --- Компоненты иконок (SVG) ---
        // Заменяет библиотеку lucide-react для работы без сборщика
        const IconBase = ({ children, size = 24, className = "", ...props }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
                {children}
            </svg>
        );

        const Icons = {
            BookOpen: (props) => <IconBase {...props}><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></IconBase>,
            Target: (props) => <IconBase {...props}><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></IconBase>,
            CheckCircle: (props) => <IconBase {...props}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></IconBase>,
            Circle: (props) => <IconBase {...props}><circle cx="12" cy="12" r="10"/></IconBase>,
            Award: (props) => <IconBase {...props}><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"/></IconBase>,
            TrendingUp: (props) => <IconBase {...props}><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></IconBase>,
            Users: (props) => <IconBase {...props}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></IconBase>,
            Brain: (props) => <IconBase {...props}><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 1.98-3A2.5 2.5 0 0 1 9.5 2Z"/><path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-1.98-3A2.5 2.5 0 0 0 14.5 2Z"/></IconBase>,
            Heart: (props) => <IconBase {...props}><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></IconBase>,
            Zap: (props) => <IconBase {...props}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></IconBase>,
            ChevronRight: (props) => <IconBase {...props}><path d="m9 18 6-6-6-6"/></IconBase>,
            Menu: (props) => <IconBase {...props}><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></IconBase>,
            X: (props) => <IconBase {...props}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></IconBase>,
            Lightbulb: (props) => <IconBase {...props}><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></IconBase>,
            AlertCircle: (props) => <IconBase {...props}><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></IconBase>,
            Star: (props) => <IconBase {...props}><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></IconBase>,
            Smile: (props) => <IconBase {...props}><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" x2="9.01" y1="9" y2="9"/><line x1="15" x2="15.01" y1="9" y2="9"/></IconBase>,
            Key: (props) => <IconBase {...props}><circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6"/><path d="m15.5 7.5 3 3L22 7l-3-3"/></IconBase>,
            RefreshCw: (props) => <IconBase {...props}><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></IconBase>,
            Scale: (props) => <IconBase {...props}><path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="M7 21h10"/><path d="M12 3v18"/><path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"/></IconBase>,
            AlertTriangle: (props) => <IconBase {...props}><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" x2="12" y1="9" y2="13"/><line x1="12" x2="12.01" y1="17" y2="17"/></IconBase>,
        };

        // --- Основное приложение ---
        const { useState, useEffect, useCallback } = React;

        const ProactiveHabitApp = () => {
            // Состояние
            const [activeSection, setActiveSection] = useState('intro');
            const [challengeProgress, setChallengeProgress] = useState({});
            const [showMenu, setShowMenu] = useState(false);
            
            // Firebase
            const [db, setDb] = useState(null);
            const [userId, setUserId] = useState(null);
            const [loadingStatus, setLoadingStatus] = useState('Загрузка...');

            // Инициализация Firebase
            useEffect(() => {
                if (!firebaseConfig) {
                    setLoadingStatus('Демо режим (без сохранения)');
                    return;
                }
                try {
                    const app = initializeApp(firebaseConfig);
                    const auth = getAuth(app);
                    const firestoreDb = getFirestore(app);
                    setDb(firestoreDb);

                    const initAuth = async () => {
                        try {
                            if (initialAuthToken) await signInWithCustomToken(auth, initialAuthToken);
                            else await signInAnonymously(auth);
                        } catch (e) {
                            console.error("Auth error:", e);
                        }
                    };
                    initAuth();

                    onAuthStateChanged(auth, (user) => {
                        setUserId(user ? user.uid : null);
                        setLoadingStatus(user ? '' : 'Вход...');
                    });
                } catch (error) {
                    console.error("Firebase init error:", error);
                    setLoadingStatus('Ошибка');
                }
            }, []);

            // Синхронизация данных
            useEffect(() => {
                if (db && userId) {
                    const docRef = doc(db, 'artifacts', appId, 'users', userId, 'proactive_data', 'progress_tracker');
                    return onSnapshot(docRef, (docSnap) => {
                        if (docSnap.exists()) {
                            setChallengeProgress(docSnap.data().progress || {});
                        }
                    }, (err) => console.error("Snapshot error:", err));
                }
            }, [db, userId]);

            const toggleDay = async (day) => {
                const newProgress = { ...challengeProgress, [day]: !challengeProgress[day] };
                setChallengeProgress(newProgress);
                if (db && userId) {
                    try {
                        await setDoc(doc(db, 'artifacts', appId, 'users', userId, 'proactive_data', 'progress_tracker'), { progress: newProgress }, { merge: true });
                    } catch (e) { console.error("Save error", e); }
                }
            };

            const completedDays = Object.values(challengeProgress).filter(Boolean).length;

            const sections = [
                { id: 'intro', title: '1. Самосознание', icon: Icons.Brain },
                { id: 'mirror', title: '2. Социальное зеркало', icon: Icons.Users },
                { id: 'determinism', title: '3. Три вида детерминизма', icon: Icons.AlertCircle },
                { id: 'frankl', title: '4. Урок Виктора Франкла', icon: Icons.Heart },
                { id: 'proactivity', title: '5. Суть проактивности', icon: Icons.Zap },
                { id: 'initiative', title: '6. Брать инициативу', icon: Icons.Target },
                { id: 'language', title: '7. Реактивная речь', icon: Icons.BookOpen },
                { id: 'circles', title: '8. Круги Влияния', icon: Icons.TrendingUp },
                { id: 'control', title: '9. Типы контроля', icon: Icons.Star },
                { id: 'expanding', title: '10. Расширение влияния', icon: Icons.Lightbulb },
                { id: 'havebe', title: '11. Иметь или Быть', icon: Icons.Smile },
                { id: 'love', title: '12. Любовь — это глагол', icon: Icons.Heart },
                { id: 'consequences', title: '13. Выбор и Последствия', icon: Icons.Scale },
                { id: 'commitments', title: '14. Обязательства', icon: Icons.CheckCircle },
                { id: 'challenge', title: '15. 30-дневный тест', icon: Icons.Award }
            ];

            // Вспомогательные компоненты
            const InfoCard = ({ icon: IconComp, title, text, color }) => (
                <div className={`bg-white p-4 md:p-5 rounded-xl border-l-4 border-${color}-500 shadow-md hover:shadow-lg transition-shadow mb-4 md:mb-0`}>
                    <div className="flex items-center gap-3 mb-2">
                        <div className={`p-2 rounded-full bg-${color}-100 text-${color}-600 flex-shrink-0`}>
                            <IconComp size={20} />
                        </div>
                        <h4 className={`font-bold text-${color}-900 text-sm md:text-base`}>{title}</h4>
                    </div>
                    <p className="text-sm text-gray-700 leading-relaxed">{text}</p>
                </div>
            );

            const QuoteBlock = ({ text, author }) => (
                <div className="bg-gradient-to-r from-gray-50 to-gray-100 border-l-4 border-purple-500 p-4 md:p-6 rounded-r-xl my-4 italic text-gray-700 shadow-sm text-sm md:text-base">
                    "{text}"
                    {author && <div className="mt-2 text-xs font-bold text-purple-600 not-italic">— {author}</div>}
                </div>
            );

            // Визуализация Кругов
            const CirclesVisualization = () => (
                <div className="my-6 p-4 bg-gradient-to-br from-blue-50 to-indigo-50 rounded-xl shadow-inner">
                    <h3 className="text-lg md:text-xl font-bold text-center mb-6 text-gray-800">Фокус внимания</h3>
                    <div className="flex flex-col md:flex-row justify-around items-center gap-8">
                        <div className="relative">
                            <div className="w-48 h-48 md:w-64 md:h-64 rounded-full bg-red-100 border-4 border-red-300 flex items-center justify-center shadow-lg transition-all">
                                <div className="w-32 h-32 md:w-40 md:h-40 rounded-full bg-red-200 border-4 border-red-400 flex items-center justify-center">
                                    <div className="text-center p-2">
                                        <p className="font-bold text-red-900 text-sm md:text-base">Круг Забот</p>
                                        <p className="text-[10px] md:text-xs mt-1 text-red-800 leading-tight">Внешние условия<br/>(Вне контроля)</p>
                                    </div>
                                </div>
                            </div>
                            <div className="absolute -bottom-3 left-0 right-0 text-center">
                                <span className="bg-red-500 text-white px-3 py-1 rounded-full text-xs md:text-sm shadow-md font-bold">Влияние сужается</span>
                            </div>
                        </div>
                        <div className="md:hidden text-gray-300 rotate-90"><Icons.ChevronRight size={24}/></div>
                        <div className="relative">
                            <div className="w-48 h-48 md:w-64 md:h-64 rounded-full bg-green-100 border-4 border-green-300 flex items-center justify-center shadow-lg transition-all">
                                <div className="w-36 h-36 md:w-48 md:h-48 rounded-full bg-green-200 border-4 border-green-400 flex items-center justify-center">
                                    <div className="text-center p-2">
                                        <p className="font-bold text-green-900 text-sm md:text-base">Круг Влияния</p>
                                        <p className="text-[10px] md:text-xs mt-1 text-green-800 leading-tight">Мой характер<br/>Мои решения</p>
                                    </div>
                                </div>
                            </div>
                            <div className="absolute -bottom-3 left-0 right-0 text-center">
                                <span className="bg-green-500 text-white px-3 py-1 rounded-full text-xs md:text-sm shadow-md font-bold">Влияние растет</span>
                            </div>
                        </div>
                    </div>
                </div>
            );

            // Рендер контента
            const renderContent = () => {
                const fadeClass = "animate-in space-y-6 pb-20 md:pb-0";
                
                switch (activeSection) {
                    case 'intro': return (
                        <div className={fadeClass}>
                            <h2 className="text-2xl md:text-3xl font-bold text-gray-800">1. Самосознание: Дар человека</h2>
                            <QuoteBlock text="Не знаю в жизни ничего более воодушевляющего, чем бесспорная способность человека путем сознательных усилий возвышать жизнь свою." author="Генри Дэвид Торо" />
                            <div className="bg-blue-50 p-4 md:p-6 rounded-xl border-t-4 border-blue-400 shadow-sm">
                                <h3 className="font-bold text-blue-900 mb-2 flex items-center gap-2 text-base md:text-lg"><Icons.Brain size={20}/> Упражнение</h3>
                                <p className="text-sm md:text-base text-gray-700">То, что вы можете посмотреть на себя со стороны — доказательство наличия у вас <b>Самосознания</b>. Это то, что отличает нас от животных.</p>
                            </div>
                            <h3 className="font-bold text-lg md:text-xl text-gray-800 mt-6 mb-4">4 Уникальных дара:</h3>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <InfoCard color="purple" icon={Icons.Brain} title="Самосознание" text="Понимание своих мыслей, настроений и парадигм." />
                                <InfoCard color="green" icon={Icons.Heart} title="Совесть" text="Внутреннее чувство правильного и неправильного." />
                                <InfoCard color="blue" icon={Icons.Zap} title="Воображение" text="Способность создавать в уме то, чего нет в реальности." />
                                <InfoCard color="orange" icon={Icons.TrendingUp} title="Независимая воля" text="Способность действовать, опираясь на самосознание." />
                            </div>
                        </div>
                    );
                    case 'mirror': return (
                        <div className={fadeClass}>
                            <h2 className="text-2xl md:text-3xl font-bold text-gray-800">2. Социальное зеркало</h2>
                            <div className="bg-gradient-to-r from-gray-100 to-gray-200 p-4 md:p-6 rounded-xl text-center text-gray-600 italic text-sm md:text-lg shadow-inner">
                            «Ты вечно опаздываешь!» • «Ты гений!» • «Ты ешь как слон!»
                            </div>
                            <p className="text-sm md:text-lg text-gray-700">Если наше самоощущение строится только на отзывах окружающих, мы живем в <b>Кривом Зеркале</b>.</p>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mt-2">
                                <div className="bg-red-50 p-4 md:p-6 rounded-xl border-t-4 border-red-400 shadow-md">
                                    <h4 className="font-bold text-red-900 text-base md:text-lg mb-2 flex items-center gap-2"><Icons.X size={20}/> Реактивный путь</h4>
                                    <p className="text-sm md:text-base text-gray-700">Мы принимаем чужие сценарии. Мы — жертвы мнений.</p>
                                </div>
                                <div className="bg-green-50 p-4 md:p-6 rounded-xl border-t-4 border-green-400 shadow-md">
                                    <h4 className="font-bold text-green-900 text-base md:text-lg mb-2 flex items-center gap-2"><Icons.CheckCircle size={20}/> Проактивный путь</h4>
                                    <p className="text-sm md:text-base text-gray-700">Мы сами пишем свой сценарий, опираясь на принципы.</p>
                                </div>
                            </div>
                        </div>
                    );
                    case 'determinism': return (
                        <div className={fadeClass}>
                            <h2 className="text-2xl md:text-3xl font-bold text-gray-800">3. Три карты детерминизма</h2>
                            <div className="space-y-3 md:space-y-4">
                                <div className="flex items-start gap-3 md:gap-4 p-4 bg-white border rounded-xl shadow-md">
                                    <div className="bg-blue-100 p-2 md:p-3 rounded-full text-blue-600 flex-shrink-0"><Icons.Key size={20}/></div>
                                    <div><h4 className="font-bold text-gray-800 text-sm md:text-lg">1. Генетический</h4><p className="text-xs md:text-sm text-gray-700">«Это у меня в ДНК. Дед был таким же».</p></div>
                                </div>
                                <div className="flex items-start gap-3 md:gap-4 p-4 bg-white border rounded-xl shadow-md">
                                    <div className="bg-orange-100 p-2 md:p-3 rounded-full text-orange-600 flex-shrink-0"><Icons.RefreshCw size={20}/></div>
                                    <div><h4 className="font-bold text-gray-800 text-sm md:text-lg">2. Психический</h4><p className="text-xs md:text-sm text-gray-700">«Виновато воспитание. В детстве меня обижали».</p></div>
                                </div>
                                <div className="flex items-start gap-3 md:gap-4 p-4 bg-white border rounded-xl shadow-md">
                                    <div className="bg-green-100 p-2 md:p-3 rounded-full text-green-600 flex-shrink-0"><Icons.Users size={20}/></div>
                                    <div><h4 className="font-bold text-gray-800 text-sm md:text-lg">3. Окружения</h4><p className="text-xs md:text-sm text-gray-700">«Виноват начальник, жена, кризис».</p></div>
                                </div>
                            </div>
                        </div>
                    );
                    case 'frankl': return (
                        <div className={fadeClass}>
                            <h2 className="text-2xl md:text-3xl font-bold text-gray-800">4. Урок Виктора Франкла</h2>
                            <QuoteBlock text="У человека можно отнять все, кроме одного: последней свободы человека — выбирать собственное отношение к любым обстоятельствам." author="Виктор Франкл" />
                            <p className="text-sm md:text-base text-gray-700">В концлагере Франкл открыл внутреннюю свободу, которую нацисты не могли отнять.</p>
                            <div className="my-6 p-4 md:p-6 bg-gradient-to-br from-purple-50 to-pink-50 rounded-xl shadow-lg text-center">
                                <p className="font-extrabold mb-3 text-sm md:text-lg tracking-wider text-purple-800">СВОБОДА ВЫБОРА</p>
                                <div className="flex justify-center items-center gap-2 text-xs md:text-sm text-gray-600">
                                    <span>Раздражитель</span> <span>➜</span> <b>Реакция</b>
                                </div>
                            </div>
                        </div>
                    );
                    case 'proactivity': return (
                        <div className={fadeClass}>
                            <h2 className="text-2xl md:text-3xl font-bold text-gray-800">5. Суть проактивности</h2>
                            <div className="bg-gradient-to-r from-indigo-500 to-purple-600 text-white p-6 md:p-8 rounded-2xl text-center shadow-xl mb-4">
                                <p className="text-2xl md:text-3xl font-extrabold tracking-widest mb-2">RESPONSIBILITY</p>
                                <p className="text-sm md:text-lg font-medium">RESPONSE (Ответ) + ABILITY (Способность)</p>
                            </div>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-6">
                                <div className="bg-white p-4 md:p-6 rounded-xl shadow-md border-t-4 border-yellow-400">
                                    <h4 className="font-bold text-gray-800 mb-2 flex items-center gap-2 text-base md:text-lg"><Icons.Lightbulb className="text-yellow-500" size={20}/> Своя погода</h4>
                                    <p className="text-sm text-gray-600">Проактивные люди носят свою погоду внутри. Ими движут ценности.</p>
                                </div>
                                <div className="bg-white p-4 md:p-6 rounded-xl shadow-md border-t-4 border-gray-400">
                                    <h4 className="font-bold text-gray-800 mb-2 flex items-center gap-2 text-base md:text-lg"><Icons.Users className="text-gray-400" size={20}/> Чужая погода</h4>
                                    <p className="text-sm text-gray-600">Реактивные люди зависят от социальной погоды. Они занимают оборону.</p>
                                </div>
                            </div>
                        </div>
                    );
