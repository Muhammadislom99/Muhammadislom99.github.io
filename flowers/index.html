<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Офисные цветы</title>
<style>
:root{--bg:#f4f6f2;--card:#fff;--tx:#18241c;--mu:#66736b;--ac:#2f7d52;--ln:#e3e8e1;--tint:#e9f0e8;--sh:0 8px 24px rgba(30,60,40,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1511;--card:#17201a;--tx:#e7efe9;--mu:#8da094;--ac:#6ec48f;--ln:#243029;--tint:#1d2a22;--sh:0 8px 24px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#0f1511;--card:#17201a;--tx:#e7efe9;--mu:#8da094;--ac:#6ec48f;--ln:#243029;--tint:#1d2a22;--sh:0 8px 24px rgba(0,0,0,.35)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 "Nunito","Segoe UI",system-ui,sans-serif;transition:background .3s,color .3s}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1000px;margin:0 auto;padding:16px 20px;background:var(--bg)}
h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.01em}
.sub{margin:0;color:var(--mu);font-size:14px}
.ib{width:42px;height:42px;border-radius:50%;border:1px solid var(--ln);background:var(--card);display:grid;place-items:center;font-size:18px;flex:none}
main{max-width:1000px;margin:0 auto;padding:4px 20px 40px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.card{border:1px solid var(--ln);background:var(--card);border-radius:22px;padding:10px 10px 14px;text-align:center;box-shadow:var(--sh);transition:transform .2s}
.card:hover{transform:translateY(-3px)}
.card .art{background:var(--tint);border-radius:16px;aspect-ratio:1;display:grid;place-items:center;overflow:hidden}
.card svg,.hero svg{width:100%;height:100%;display:block}
.card b{display:block;margin-top:10px;font-size:15px;line-height:1.25}
.back{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ln);background:var(--card);border-radius:20px;padding:8px 14px;margin-bottom:16px}
.det{display:grid;gap:22px}
@media(min-width:760px){.det{grid-template-columns:320px 1fr;align-items:start}}
.hero{background:var(--tint);border-radius:28px;aspect-ratio:1;overflow:hidden}
h2{margin:0;font-size:28px;letter-spacing:-.02em}
.lat{color:var(--mu);font-style:italic;margin:2px 0 14px}
.tip{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:12px 14px;margin:0 0 18px;font-size:15px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--tint);padding:5px;border-radius:16px;margin-bottom:14px}
.tabs button{border:0;background:none;border-radius:12px;padding:9px 2px;font-size:14px;color:var(--mu)}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--tx);font-weight:700;box-shadow:var(--sh)}
.rows{display:grid;gap:10px}
.row{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:12px 14px}
.row svg{width:46px;height:46px;flex:none}
.row small{display:block;color:var(--mu);font-size:13px}
.row span{font-weight:600}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.vs{display:flex;gap:6px;margin-top:10px}
.vs button{border:1px solid var(--ln);background:var(--card);border-radius:14px;padding:6px 12px;font-size:13px;color:var(--mu)}
.vs button[aria-pressed="true"]{background:var(--ac);border-color:var(--ac);color:var(--bg);font-weight:700}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

</svg>

<header>
  <div><h1 id="ttl">Офисные цветы</h1><p class="sub" id="sub"></p></div>
  <button class="ib" id="th" aria-label="Сменить тему">◐</button>

 {id:'ficus',n:'Фикус эластика',lat:'Ficus elastica',t:'fan',c:'#1f5a3a',k:'tr',pot:'#ecebe6',tip:'Не любит перестановок. Листья протирайте влажной тканью.'},
 {id:'anth',n:'Антуриум',lat:'Anthurium andraeanum',t:'spa',c:'#2f7a45',k:'hu',tip:'Нужна влажность воздуха. Цветёт при ярком рассеянном свете.'},
 {id:'agla',n:'Аглаонема',lat:'Aglaonema',t:'fan',c:'#5a9a6a',c2:'#ef8a98',k:'tr',tip:'Терпит полутень, но розовая окраска ярче на свету.'},
 {id:'crot',n:'Кротон',lat:'Codiaeum variegatum',t:'fan',c:'#3d7a3a',c2:'#d9532e',k:'hu',tip:'Боится сквозняков и перестановок. На свету листья ярче.'},
 {id:'azal',n:'Азалия',lat:'Rhododendron simsii',t:'bush',c:'#2c6b3f',c2:'#1f5532',f:'#ff7fae',k:'hu',tip:'Любит прохладу: зимой лучше 10–16 °C, это ниже обычных значений. Поливать мягкой водой.'},
 {id:'kalan',n:'Каланхоэ',lat:'Kalanchoe blossfeldiana',t:'ros',w:.3,c:'#5aa85a',f:'#ff6fa0',k:'su',tip:'Для цветения нужен короткий световой день осенью.'},
 {id:'cala',n:'Калатея Макоя',lat:'Calathea makoyana',t:'fan',c:'#6fae62',st:1,k:'hu',tip:'Поливать отстоянной водой. На ночь листья складываются, это норма.'},
 {id:'dief',n:'Диффенбахия',lat:'Dieffenbachia',t:'fan',c:'#7cb88a',dots:'#e9f4e9',k:'tr',tip:'Сок ядовит: обрезайте в перчатках.'},
 {id:'drac',n:'Драцена Сандера',lat:'Dracaena sanderiana',t:'spike',c:'#3f9a3f',k:'tr',tip:'«Бамбук счастья». Если растёт в воде, меняйте её раз в 1–2 недели.'},
 {id:'gast',n:'Гастерия',lat:'Gasteria',t:'ros',w:.16,c:'#3a6b4a',k:'su',pot:'#22252a',tip:'Холодной зимой почти не поливать.'},
 {id:'aloe',n:'Алоэ вера',lat:'Aloe vera',t:'ros',w:.15,c:'#6aaa5a',k:'su',tip:'Поливайте только по краю горшка, лишняя вода из поддона уходит.'},
 {id:'fish',n:'Золотая рыбка',lat:'Carassius auratus',t:'fish',k:'fi',tip:'Нужен аквариум от 40 л на рыбку, с фильтром и аэрацией. На выходные и праздники пригодится автокормушка.'},
 {id:'cact',n:'Кактус',lat:'Cactaceae',t:'cac',c:'#4f9a50',k:'su',pot:'#dfe8e0',tip:'Зимой нужен прохладный покой, иначе весной не зацветёт.'}
];
const app=document.getElementById('app'),ttl=document.getElementById('ttl'),sub=document.getElementById('sub');
const cur=()=>{const m=new Date().getMonth();return m<2||m==11?0:m<5?1:m<8?2:3};
let season=cur();
function home(){
  ttl.textContent='Офисные цветы';sub.textContent='Всего в офисе: '+P.length;
  app.innerHTML='<div class="grid">'+P.map(p=>`<button class="card" data-id="${p.id}" style="font:inherit;color:inherit;cursor:pointer"><div class="art">${art(p)}</div><b>${p.n}</b></button>`).join('')+'</div>';
  app.querySelectorAll('.card').forEach(b=>b.onclick=()=>{location.hash='#'+b.dataset.id});
}
function detail(p){
  ttl.textContent=p.n;sub.textContent=p.lat;
  const draw=()=>{
    const d=C[p.k][season];
    app.querySelector('.tabs').innerHTML=S.map((s,i)=>`<button role="tab" aria-selected="${i==season}" data-i="${i}">${s}</button>`).join('');
    app.querySelector('.rows').innerHTML=(p.k==='fi'?FL:R).map((r,i)=>`<div class="row"><svg><use href="#i-${r[0]}"/></svg><div><small>${r[1]}</small><span>${d[i]}</span></div></div>`).join('');
    app.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{season=+b.dataset.i;draw()});
  };
  const ph=PH[p.id]||[],vw=ph.map(u=>`<img src="${u}" alt="${p.n}">`).concat([art(p)]);
  app.innerHTML=`<button class="back">← Все цветы</button><div class="det"><div><div class="hero">${vw[0]}</div>${ph.length?'<div class="vs">'+vw.map((_,i)=>`<button data-v="${i}" aria-pressed="${i==0}">${i<ph.length?(ph.length>1?'Фото '+(i+1):'Фото'):'Рисунок'}</button>`).join('')+'</div>':''}</div><div><h2>${p.n}</h2><p class="lat">${p.lat}</p><p class="tip">${p.tip}</p><div class="tabs" role="tablist"></div><div class="rows"></div></div></div>`;
  app.querySelector('.back').onclick=()=>{location.hash=''};
  app.querySelectorAll('.vs button').forEach(b=>b.onclick=()=>{app.querySelector('.hero').innerHTML=vw[+b.dataset.v];app.querySelectorAll('.vs button').forEach(x=>x.setAttribute('aria-pressed',x===b))});
  draw();
}
function route(){const id=location.hash.slice(1),p=P.find(x=>x.id===id);p?detail(p):home();window.scrollTo(0,0)}
addEventListener('hashchange',route);
const root=document.documentElement;
try{const t=localStorage.getItem('theme');if(t)root.dataset.theme=t}catch(e){}
document.getElementById('th').onclick=()=>{
  const dark=root.dataset.theme?root.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;
  root.dataset.theme=dark?'light':'dark';
  try{localStorage.setItem('theme',root.dataset.theme)}catch(e){}
};
route();
</script>
</body>
</html>
