<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Офисные цветы</title>
<style>
:root{--bg:#f4f6f2;--card:#fff;--tx:#18241c;--mu:#66736b;--ac:#2f7d52;--ln:#e3e8e1;--tint:#e9f0e8;--sh:0 8px 24px rgba(30,60,40,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1511;--card:#17201a;--tx:#e7efe9;--mu:#8da094;--ac:#6ec48f;--ln:#243029;--tint:#1d2a22;--sh:0 8px 24px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#0f1511;--card:#17201a;--tx:#e7efe9;--mu:#8da094;--ac:#6ec48f;--ln:#243029;--tint:#1d2a22;--sh:0 8px 24px rgba(0,0,0,.35)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 "Nunito","Segoe UI",system-ui,sans-serif;transition:background .3s,color .3s}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1000px;margin:0 auto;padding:16px 20px;background:var(--bg)}
h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.01em}
.sub{margin:0;color:var(--mu);font-size:14px}
.ib{width:42px;height:42px;border-radius:50%;border:1px solid var(--ln);background:var(--card);display:grid;place-items:center;font-size:18px;flex:none}
main{max-width:1000px;margin:0 auto;padding:4px 20px 40px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.card{border:1px solid var(--ln);background:var(--card);border-radius:22px;padding:10px 10px 14px;text-align:center;box-shadow:var(--sh);transition:transform .2s}
.card:hover{transform:translateY(-3px)}
.card .art{background:var(--tint);border-radius:16px;aspect-ratio:1;display:grid;place-items:center;overflow:hidden}
.card svg,.hero svg{width:100%;height:100%;display:block}
.card b{display:block;margin-top:10px;font-size:15px;line-height:1.25}
.back{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ln);background:var(--card);border-radius:20px;padding:8px 14px;margin-bottom:16px}
.det{display:grid;gap:22px}
@media(min-width:760px){.det{grid-template-columns:320px 1fr;align-items:start}}
.hero{background:var(--tint);border-radius:28px;aspect-ratio:1;overflow:hidden}
h2{margin:0;font-size:28px;letter-spacing:-.02em}
.lat{color:var(--mu);font-style:italic;margin:2px 0 14px}
.tip{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:12px 14px;margin:0 0 18px;font-size:15px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--tint);padding:5px;border-radius:16px;margin-bottom:14px}
.tabs button{border:0;background:none;border-radius:12px;padding:9px 2px;font-size:14px;color:var(--mu)}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--tx);font-weight:700;box-shadow:var(--sh)}
.rows{display:grid;gap:10px}
.row{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:12px 14px}
.row svg{width:46px;height:46px;flex:none}
.row small{display:block;color:var(--mu);font-size:13px}
.row span{font-weight:600}
.row.water{display:block}
.wbtn{display:flex;align-items:center;gap:14px;width:100%;border:0;background:none;padding:0;text-align:left}
.wbtn .txt{flex:1;min-width:0}
.chev{width:8px;height:8px;border-right:2px solid var(--mu);border-bottom:2px solid var(--mu);transform:rotate(45deg);flex:none;margin-right:4px}
.wbtn[aria-expanded="true"] .chev{transform:rotate(-135deg)}
.wlist{margin-top:12px;padding-top:10px;border-top:1px solid var(--ln)}
.wlist ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.wlist li{display:flex;justify-content:space-between;align-items:center;background:var(--tint);border-radius:12px;padding:8px 12px;font-size:15px}
.wlist li span{color:var(--mu)}
.wlist li b{font-weight:700}
.wlist p{margin:8px 0 0;color:var(--mu);font-size:13px;font-weight:500}
.wlist ul.stack li{display:block}
.wlist ul.stack li span{display:block;font-size:12px;font-weight:700;margin-bottom:2px}
.tip b{font-weight:800}
.tip .lead{display:block;margin-bottom:10px}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.vs{display:flex;gap:6px;margin-top:10px}
.vs button{border:1px solid var(--ln);background:var(--card);border-radius:14px;padding:6px 12px;font-size:13px;color:var(--mu)}
.vs button[aria-pressed="true"]{background:var(--ac);border-color:var(--ac);color:var(--bg);font-weight:700}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<defs>

</svg>

<header>
  <div><h1 id="ttl">Офисные цветы</h1><p class="sub" id="sub"></p></div>
  <button class="ib" id="th" aria-label="Сменить тему">◐</button>
</header>
<main id="app"></main>

      if(r[0]==='f'){
        const body=`<ul class="stack"><li><span>Чем</span>${care.what}</li><li><span>Как</span>${care.how}</li><li><span>В этот сезон</span>${d[i]}</li></ul>`;
        return `<div class="row water"><button type="button" class="wbtn" data-fold="f" aria-expanded="${feedOpen}"><svg><use href="#i-f"/></svg><span class="txt"><small>Подкормка</small><span>${d[i]}</span></span><i class="chev" aria-hidden="true"></i></button><div class="wlist"${feedOpen?'':' hidden'}>${body}</div></div>`;
      }
      return `<div class="row"><svg><use href="#i-${r[0]}"/></svg><div><small>${r[1]}</small><span>${d[i]}</span></div></div>`;
    }).join('');
    app.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{season=+b.dataset.i;draw()});
    app.querySelectorAll('.wbtn').forEach(b=>b.onclick=()=>{if(b.dataset.fold==='w')waterOpen=!waterOpen;else feedOpen=!feedOpen;draw()});
  };
  const ph=PH[p.id]||[],vw=ph.map(u=>`<img src="${u}" alt="${p.n}">`).concat([art(p)]);
  app.innerHTML=`<button class="back">← Все цветы</button><div class="det"><div><div class="hero">${vw[0]}</div>${ph.length?'<div class="vs">'+vw.map((_,i)=>`<button data-v="${i}" aria-pressed="${i==0}">${i<ph.length?(ph.length>1?'Фото '+(i+1):'Фото'):'Рисунок'}</button>`).join('')+'</div>':''}</div><div><h2>${p.n}</h2><p class="lat">${p.lat}</p><p class="tip"><span class="lead">${care.about}</span><b>Любит.</b> ${care.like}<br><b>Не любит.</b> ${care.hate}<br><b>Проблемы.</b> ${care.ill}</p><div class="tabs" role="tablist"></div><div class="rows"></div></div></div>`;
  app.querySelector('.back').onclick=()=>{location.hash=''};
  app.querySelectorAll('.vs button').forEach(b=>b.onclick=()=>{app.querySelector('.hero').innerHTML=vw[+b.dataset.v];app.querySelectorAll('.vs button').forEach(x=>x.setAttribute('aria-pressed',x===b))});
  draw();
}
function route(){const id=location.hash.slice(1),p=P.find(x=>x.id===id);p?detail(p):home();window.scrollTo(0,0)}
addEventListener('hashchange',route);
const root=document.documentElement;
try{const t=localStorage.getItem('theme');if(t)root.dataset.theme=t}catch(e){}
document.getElementById('th').onclick=()=>{
  const dark=root.dataset.theme?root.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;
  root.dataset.theme=dark?'light':'dark';
  try{localStorage.setItem('theme',root.dataset.theme)}catch(e){}
};
route();
</script>
</body>
