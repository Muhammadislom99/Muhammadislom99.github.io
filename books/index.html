<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Книги</title>
  <link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#faf8f4; --surface:#fff; --text:#22201c; --muted:#6b655b; --line:#e4ded2; --accent:#b23a2b; }
    @media (prefers-color-scheme: dark) { :root { --bg:#15140f; --surface:#1d1c17; --text:#ebe6dc; --muted:#a39d90; --line:#34312a; --accent:#e0705f; } }
    body { margin:0; background:var(--bg); color:var(--text); font-family:Inter, system-ui, sans-serif; line-height:1.6; }
    main { max-width:760px; margin:0 auto; padding:48px 16px; }
    h1 { font-family:Literata, Georgia, serif; font-size:2.4rem; margin:0 0 8px; }
    p { color:var(--muted); }
    a.book { display:block; margin-top:20px; padding:22px; border:1px solid var(--line); border-radius:14px; background:var(--surface); color:var(--text); text-decoration:none; }
    a.book:hover { border-color:var(--accent); }
    a.book h2 { font-family:Literata, Georgia, serif; margin:0 0 4px; }
    a.book span { color:var(--accent); font-size:.85rem; letter-spacing:.1em; text-transform:uppercase; }
  </style>
</head>
<body>
  <main>
    <h1>Книги</h1>
    <p>Интерактивные путеводители по прочитанным книгам.</p>
    <a class="book" href="samurai-bez-mecha/">
      <span>Китами Масао</span>
      <h2>Самурай без меча</h2>
      <p>Жизнь Тоётоми Хидэёси, уроки по темам, хронология, тест и читалка.</p>
    </a>
  </main>
</body>
</html>
